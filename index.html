<style>
  :root {
    --navy: #1d4157;
    --gold: #a4824a;

    --paper: #ffffff;
    --sans: "Manrope", "Noto Sans Hebrew", system-ui, sans-serif;
    --serif: "Noto Serif", "Noto Serif Hebrew", Georgia, serif;
  }
  * { box-sizing: border-box; }
  /* The printed menu is a white page, so it stays white regardless of OS theme */
  html, body { margin: 0; background: var(--paper); color: var(--navy); font-family: var(--sans); }

  .page { position: relative; max-width: 940px; margin: 0 auto; padding: 56px 88px 64px; }

  /* Gold rule with the four-point star centred on it, top and bottom */
  .rule { position: relative; height: 40px; }
  .rule::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid var(--line); }
  .rule svg { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 18px; height: 40px; }

  /* Vertical section titles in the margins, as on the PDF page */
  .side { position: absolute; top: 120px; font-family: var(--serif); font-style: italic; font-size: 30px; line-height: 1; white-space: nowrap; writing-mode: vertical-rl; }
  .side-el { left: 26px; color: var(--gold); font-weight: 400; transform: rotate(180deg); }
  .side-tr { right: 26px; color: var(--navy); font-weight: 700; }
  .mobile-head { display: none; }

  .items { display: grid; grid-template-columns: 1fr 72px 1fr; column-gap: 18px; row-gap: 15px; padding: 28px 0 30px; }
  .el { text-align: right; }
  .price { text-align: center; color: var(--price); font-weight: 800; font-size: 15px; }
  .tr { text-align: start; color: var(--gold); }
  .name { font-weight: 800; font-size: 15px; }
  .desc { font-weight: 300; font-size: 14px; line-height: 1.3; }
  .block .desc { display: block; }
  .el .desc { color: var(--navy); }

  /* Language selector — ported from masao LanguageSelector.tsx */
  .lang { position: fixed; top: 14px; right: 14px; z-index: 50; }
  .lang-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid #e3d7c3; border-radius: 999px; background: #fff; color: var(--navy); font: 500 14px var(--sans); cursor: pointer; transition: border-color .15s; }
  .lang-btn:hover, .lang-btn:focus-visible { border-color: var(--gold); }
  .lang-btn .code { font-weight: 700; text-transform: uppercase; }
  .lang-list { position: absolute; right: 0; margin: 8px 0 0; padding: 4px 0; min-width: 176px; list-style: none; background: #fff; border: 1px solid #e3d7c3; border-radius: 12px; box-shadow: 0 12px 30px rgba(29,65,87,.18); overflow: hidden; }
  .lang-list[hidden] { display: none; }
  .lang-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 14px; border: 0; background: none; color: var(--navy); font: 600 14px var(--sans); text-align: start; cursor: pointer; }
  .lang-list button:hover { background: #f7f2ea; }
  .lang-list button[aria-selected="true"] { color: var(--gold); }
  .lang-list .check { margin-inline-start: auto; }
  .fi { border-radius: 2px; }

  /* Phones: three columns don't fit, so the translation sits under the Greek */
  @media (max-width: 720px) {
    .page { padding: 64px 16px 40px; }
    .side { display: none; }
    .mobile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--serif); font-style: italic; font-size: 26px; padding-top: 12px; }
    .mobile-head .h-el { color: var(--gold); }
    .mobile-head .h-tr { color: var(--navy); font-weight: 700; }
    .items { grid-template-columns: 1fr auto; row-gap: 0; column-gap: 14px; }
    .el { text-align: start; grid-column: 1; padding-top: 14px; }
    .price { grid-column: 2; grid-row: span 2; padding-top: 14px; }
    .tr { grid-column: 1; padding-bottom: 2px; }
  }
</style>

// Self-check: every dish must exist in Greek and every offered language.
for (const item of ITEMS)
  for (const code of ["el", ...LANGUAGES.map((l) => l.code)])
    console.assert(item[code] && item[code][0], `Missing ${code} for`, item.el && item.el[0]);

const STORAGE_KEY = "manolis-lang";
const DEFAULT_LANG = "en";
const isSupported = (code) => LANGUAGES.some((l) => l.code === code);

// Stored choice wins; otherwise a French phone opens straight in French.
function initialLang() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (isSupported(stored)) return stored;
  } catch {}
  const browser = (navigator.language || "").slice(0, 2).toLowerCase();
  const mapped = browser === "nb" || browser === "nn" ? "no" : browser === "iw" ? "he" : browser;
  return isSupported(mapped) ? mapped : DEFAULT_LANG;
}

function cell(className, [name, desc], item, lang) {
  const div = document.createElement("div");
  div.className = className + (item.inline ? "" : " block");
  if (lang) {
    div.lang = lang;
    div.dir = LANGUAGES.find((l) => l.code === lang).rtl ? "rtl" : "ltr";
  }
  const nameEl = document.createElement("span");
  nameEl.className = "name";
  nameEl.textContent = name;
  div.append(nameEl);
  if (desc) {
    const descEl = document.createElement("span");
    descEl.className = "desc";
    descEl.textContent = (item.inline ? " " : "") + desc;
    div.append(descEl);
  }
  return div;
}

function render(lang) {
  const meta = LANGUAGES.find((l) => l.code === lang);
  const dir = meta.rtl ? "rtl" : "ltr";

  const list = document.getElementById("items");
  list.replaceChildren();
  for (const item of ITEMS) {
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = item.price;
    list.append(cell("el", item.el, item), price, cell("tr", item[lang], item, lang));
  }

  for (const id of ["sideTitle", "mobileTitle"]) {
    const el = document.getElementById(id);
    el.textContent = UI[lang].title;
    el.lang = lang;
    el.dir = dir;
  }

  document.getElementById("langFlag").className = `fi fi-${meta.flag}`;
  document.getElementById("langCode").textContent = meta.code;
  document.getElementById("langBtn").setAttribute("aria-label", UI[lang].select);
  renderOptions(lang);
}

const btn = document.getElementById("langBtn");
const listbox = document.getElementById("langList");

function renderOptions(lang) {
  listbox.replaceChildren(...LANGUAGES.map((l) => {
    const li = document.createElement("li");
    const option = document.createElement("button");
    option.type = "button";
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", String(l.code === lang));
    option.innerHTML = `<span class="fi fi-${l.flag}" aria-hidden="true"></span><span></span>`;
    option.lastChild.textContent = l.label;
    if (l.code === lang) option.insertAdjacentHTML("beforeend", '<span class="check" aria-hidden="true">✓</span>');
    option.addEventListener("click", () => {
      try { localStorage.setItem(STORAGE_KEY, l.code); } catch {}
      render(l.code);
      setOpen(false);
      btn.focus();
    });
    li.append(option);
    return li;
  }));
}

function setOpen(open) {
  listbox.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
}

btn.addEventListener("click", () => setOpen(listbox.hidden));
// Close on outside click / Escape, same as masao.
document.addEventListener("mousedown", (e) => {
  if (!listbox.hidden && !e.target.closest(".lang")) setOpen(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setOpen(false);
});

render(initialLang());
</script>
